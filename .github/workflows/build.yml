name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test game rules
        run: python -m unittest discover -s tests -v

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "Cython<3.0" virtualenv==20.21.1

      - name: Build with Buildozer
        run: |
          buildozer -v android debug > build.log 2>&1 || { tail -n 150 build.log; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-logs
          path: build.log
          
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonBrickBreaker-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Ultima Version (Auto-Actualizable)"
          body: "Descarga el archivo .apk de abajo para actualizar el juego."
          files: bin/*.apk
          prerelease: false
          make_latest: true
